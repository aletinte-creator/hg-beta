<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Café para:</title>

    <style>
        body {
            background: #ddd7c8;
            font-family: Georgia, serif;
            color: #7a1f2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-weight: bold;
            margin-bottom: 34px;
        }

        .persona {
            text-align: center;
            margin-bottom: 25px;
        }

        .foto-grande {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #7a1f2b;
            margin: 0 auto 10px auto;
        }

        .foto-grande img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nombre-grande {
            font-weight: bold;
            font-size: 24px;
        }

        .texto {
            margin-top: 20px;
            line-height: 1.9;
            font-size: 18px;
        }

        .contacto {
            margin: 25px 0;
            text-align: center;
        }

        .foto-pequena {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #7a1f2b;
            margin: 10px auto;
        }

        .foto-pequena img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nombre-pequeno {
            font-weight: bold;
            font-size: 18px;
        }

        .beneficios {
            margin-top: 25px;
            line-height: 2;
            font-size: 18px;
        }

        button {
            width: 320px;
            margin: 18px auto 0;
            padding: 14px;
            border: 2px solid #7a1f2b;
            border-radius: 25px;
            background: transparent;
            color: #7a1f2b;
            font-size: 18px;
            cursor: pointer;
            display: block;
            font-weight: bold;
        }

        #btnCerrar {
            font-size: 16px;
            font-weight: bold;
            padding: 16px;
        }

        button:hover {
            background: #7a1f2b;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Un CAFÉ para:</h1>

        <div class="persona">

            <div class="foto-grande" id="fotoRemitente"></div>

            <div class="nombre-grande" id="nombreRemitente"></div>

        </div>

        <div class="texto">

            La comunicación con

        <div class="contacto">

            <div class="foto-pequena" id="fotoDestino"></div>

            <div class="nombre-pequeno" id="nombreDestino"></div>

        </div>

        <div class="texto">

            podrá reanudarse cuando te sirvamos el Café.

        </div>

        <div class="beneficios">

            ☕ 7 mensajes adicionales.<br>
            ☕ 24 horas de comunicación.

        </div>

        <div class="texto">

            ¿Deseas que te sirvamos un Café?
          <br><br>

        </div>

        <button id="btnCafe">
        <strong> SÍ, POR FAVOR</strong>
        </button>

        <button id="btnCerrar">
            👋 No Gracias. Me voy... Chau
        </button>

    </div>

    <script>

        const nombreRemitente =
            localStorage.getItem('hg_nombre_pretendiente') || 'Pretendiente';

        const nombreDestino =
            localStorage.getItem('hg_nombre_pretendido') || 'Pretendido';

        const fotoRemitente =
            localStorage.getItem('hg_foto_pretendiente');

        const fotoDestino =
            localStorage.getItem('hg_foto_pretendido');

        document.getElementById('nombreRemitente').textContent =
            nombreRemitente;

        document.getElementById('nombreDestino').textContent =
            nombreDestino;

        if (fotoRemitente) {
            document.getElementById('fotoRemitente').innerHTML =
                '<img src="' + fotoRemitente + '">';
        }

        if (fotoDestino) {
            document.getElementById('fotoDestino').innerHTML =
                '<img src="' + fotoDestino + '">';
        }

        document
            .getElementById('btnCafe')
            .addEventListener('click', () => {

                alert('Solicitud de Café registrada.');

                window.location.href = 'cortejo-reanudado.html';
            });

        document
                .getElementById('btnCerrar')
                .addEventListener('click', () => {

                    window.location.href =
                        'solicitar-cierre.html';
                });

    </script>

</body>

</html>
