<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Enviada</title>

    <style>
        body {
            background: #ddd7c8;
            font-family: Georgia, serif;
            color: #7a1f2b;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-weight: normal;
            margin-bottom: 25px;
        }

        .texto {
            line-height: 1.8;
            font-size: 17px;
        }

        .foto-perfil {

            width: 140px;
            height: 140px;

            margin: 20px auto;

            border-radius: 50%;
            overflow: hidden;

            border: 2px solid #7a1f2b;
        }

        .foto-perfil img {

            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button {

            width: 100%;
            padding: 14px;

            border: 1px solid #7a1f2b;
            border-radius: 25px;

            background: transparent;

            color: #7a1f2b;

            font-size: 16px;

            cursor: pointer;

            margin-top: 25px;
        }

        button:hover {

            background: #7a1f2b;
            color: white;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>INVITACIÓN ENVIADA</h1>

        <div class="foto-perfil" id="fotoPerfil"></div>

        <div class="texto">

            La invitación ha sido preparada correctamente.

            <br><br>

            Participante que invita:

            <br>

            <strong id="nombrePretendiente"></strong>

            <br><br>

            Estamos aguardando la respuesta del Facilitador.

        </div>

        <button onclick="window.location.href='aceptacion-facilitador.html'">
            CONTINUAR
        </button>
        
    </div>

    <script>

        document.getElementById('nombrePretendiente').textContent =
            localStorage.getItem('hg_nombre') || '';

        const foto = localStorage.getItem('hg_foto_perfil');

        if (foto) {

            document.getElementById('fotoPerfil').innerHTML =
                '<img src="' + foto + '">';

        }

    </script>

</body>

</html>
