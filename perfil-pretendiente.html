<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Pretendiente</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ddd7c8;
            font-family: Georgia, serif;
            color: #7a1f2b;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 25px 20px 40px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .instantanea {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px auto;
            border: 2px solid #7a1f2b;
            border-radius: 50%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
        }

        .presentacion {
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b7b0a3;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        input[readonly] {
            background: #f3efe6;
            color: #7a1f2b;
        }

        .separador {
            margin: 30px 0 15px 0;
            border-top: 1px solid #b7b0a3;
        }

        .boton {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 1px solid #7a1f2b;
            border-radius: 25px;
            background: transparent;
            color: #7a1f2b;
            font-size: 16px;
            cursor: pointer;
        }

        .boton:hover {
            background: #7a1f2b;
            color: white;
        }

        video,
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>PERFIL DEL PRETENDIENTE</h1>

        <div class="instantanea" id="preview">
            <video id="video" autoplay playsinline></video>

        </div>

        <br><br>

        <div class="presentacion">
            Presentate para iniciar el ciclo
        </div>          

        <div class="campo">
            <label>Correo electrónico</label>
            <input type="email" id="correoPretendiente">
        </div>        

        <div class="campo">
            <label>Nombre</label>
            <input type="text" id="nombre" oninput="localStorage.setItem('hg_nombre_pretendiente', this.value)">
        </div>

        <div class="campo">
            <label>Número de documento (sin puntos ni guiones)</label>
            <input type="text" id="documento" maxlength="8" inputmode="numeric">
        </div>

        <div class="campo">
            <label>Nacionalidad</label>
            <input type="text" id="nacionalidad">
        </div>

        <div class="campo">
            <label>Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento">
        </div>

        <div class="campo">
            <label>Teléfono</label>
            <input type="tel" id="telefono">
        </div>
        <div class="separador"></div>

        <p style="
                    margin-top:10px;
                    margin-bottom:25px;
                    font-size:14px;
                    color:#7a1f2b;
                    line-height:1.5;
                    ">
            El siguientes dato fue incorporado por HG y no puede ser modificado.
        </p>
        <div class="campo">
            <label>Rol Asignado</label>
            <input type="text" id="rolAsignado" value="PRETENDIENTE" readonly>
        </div>

        <button class="boton" onclick="continuarPerfil()">
            CONTINUAR
        </button>

        <button class="boton" onclick="window.location.href='normas.html'">
            VOLVER
        </button>

    </div>

    <script>

        const preview = document.getElementById('preview');
        const video = document.getElementById('video');

        let streamActivo = null;

        navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            }
        })
            .then(stream => {

                streamActivo = stream;

                video.srcObject = stream;

                preview.addEventListener('click', function () {

                    const canvas = document.createElement('canvas');

                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    const ctx = canvas.getContext('2d');

                    ctx.drawImage(
                        video,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                    const foto = canvas.toDataURL('image/png');

                    localStorage.setItem(
                        'hg_foto_pretendiente',
                        foto
                    );

                    if (streamActivo) {

                        streamActivo.getTracks().forEach(
                            track => track.stop()
                        );

                        video.srcObject = null;
                        streamActivo = null;
                    }

                    preview.innerHTML =
                        '<img src="' + foto + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
                });

            })
            .catch(error => {

                console.error(error);

                preview.innerHTML =
                    '<div style="padding:25px;text-align:center;">No se pudo acceder a la cámara.</div>';

            });

        document.getElementById('correoPretendiente').value =
            localStorage.getItem('hg_correo_pretendiente') || '';

        document.getElementById('expedienteId').value =
            localStorage.getItem('hg_expediente_id') || '';

        document.getElementById('invitacionId').value =
            localStorage.getItem('hg_invitacion_id') || '';

        document.getElementById('rolAsignado').value =
            'PRETENDIENTE';

         async function continuarPerfil() {

                const email =
                    document.getElementById('correoPretendiente').value.trim();

                const nombre =
                    document.getElementById('nombre').value.trim();

                const documento =
                    document.getElementById('documento').value;

                const nacionalidad =
                    document.getElementById('nacionalidad').value.trim();

                const fechaNacimiento =
                    document.getElementById('fechaNacimiento').value;

                const telefono =
                    document.getElementById('telefono').value.trim();

                if (!email) {
                    alert('Debe ingresar un correo electrónico.');
                    return;
                }

                try {

                    const respuesta = await fetch(
                        'http://localhost:3000/personas',
                        {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                email,
                                nombre,
                                documento: Number(documento),
                                nacionalidad,
                                fecha_nacimiento: fechaNacimiento,
                                telefono,
                                rol: 'PRETENDIENTE'
                            })
                        }
                    );

                    const persona = await respuesta.json();

                    console.log('PRETENDIENTE CREADO', persona);

                    localStorage.setItem(
                        'hg_correo_pretendiente',
                        email
                    );

                    localStorage.setItem(
                        'hg_persona_id_pretendiente',
                        persona.id
                    );

                    localStorage.setItem(
                        'hg_nombre_pretendiente',
                        nombre
                    );

                    window.location.href =
                        'confirmar-invitacion-facilitador.html';

                } catch (error) {

                    console.error(error);

                    alert(
                        'No se pudo crear el Pretendiente.'
                    );
                }
            }   

    </script>

</body>

</html>
