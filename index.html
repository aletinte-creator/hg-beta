<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HacemeGancho</title>

    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ddd7c8;
            font-family: Georgia, serif;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ==================================================
   DISTRIBUCIÓN 4 - 2 - 3
================================================== */

        .superior {
            flex: 4;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .medio {
            flex: 2;

            display: flex;
            justify-content: center;
            align-items: center;

            padding-bottom: 20px;

            text-align: center;
            padding-left: 24px;
            padding-right: 24px;
        }

        .inferior {
            flex: 3;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==================================================
   TAIJITU
================================================== */

        #taijitu {
            position: relative;

            width: 160px;
            height: 160px;

            animation: rotar 4s linear forwards;
            animation-delay: 4s;
        }

        .mitad {
            position: absolute;

            width: 100%;
            height: 100%;

            opacity: 0;
        }

        .blanca {
            animation:
                aparecer 1s forwards,
                moverBlanca 4s forwards;

            animation-delay: 0.5s, 0.5s;
        }

        .negra {
            animation:
                aparecer 1s forwards,
                moverNegra 4s forwards;

            animation-delay: 0.5s, 0.5s;
        }

        .forma-blanca {
            animation: colorBlanca 2s forwards;
            animation-delay: 1.5s;
        }

        .forma-negra {
            animation: colorNegra 2s forwards;
            animation-delay: 1.5s;
        }

        .punto-blanco {
            animation: colorPuntoBlanco 2s forwards;
            animation-delay: 1.5s;
        }

        .punto-negro {
            animation: colorPuntoNegro 2s forwards;
            animation-delay: 1.5s;
        }

        /* ==================================================
   TÍTULO
================================================== */

        #titulo {

            margin-top: 10px;
            margin-bottom: -15px;
            font-size: clamp(34px, 8vw, 62px);
            font-weight: normal;
            letter-spacing: 3px;
            color: #5a1020;
            opacity: 0;
            animation: fadeIn 1s forwards;
            animation-delay: 3s;
        }

        /* ==================================================
   SUBTÍTULO
================================================== */

       #subtitulo {
            font-size: clamp(20px, 4vw, 35px);
            font-weight: bold;
            color: #5a1020;
            max-width: 70%;
            line-height: 1.6;
        }
          .linea {
            opacity: 0;
            margin-bottom: 22px;
        }

          .linea1 {
            animation: fadeIn 1s forwards;
            animation-delay: 5s;
        }

          .linea2 {
            animation: fadeIn 1s forwards;
            animation-delay: 6.30s;
        }

          .linea3 {
            animation: fadeIn 1s forwards;
            animation-delay: 8s;
        }

        /* ==================================================
   BOTÓN
================================================== */

        #inicio {

            min-width: 220px;
            padding: 15px 36px;
            border: 3px solid #7a1f2b;
            border-radius: 25px;
            background: transparent;
            color: #7a1f2b;
            font-family: inherit;
            font-size: clamp(20px, 3.7vw, 26px);
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            opacity: 0;
            animation: fadeIn 1s forwards;
            animation-delay: 9s;
            transition: all .25s ease;
        }

        #inicio:hover {
            background: #7a1f2b;
            color: #ffffff;
        }

        #inicio:active {
            transform: scale(0.97);
        }

        /* ==================================================
   ANIMACIONES
================================================== */

        @keyframes aparecer {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes moverBlanca {

            from {
                transform: translateX(-300px);
            }

            to {
                transform: translateX(0);
            }
        }

        @keyframes moverNegra {

            from {
                transform: translateX(300px);
            }

            to {
                transform: translateX(0);
            }
        }

        @keyframes rotar {

            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(-320deg);
            }
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes colorBlanca {

            from {
                fill: #ffffff;
                stroke: #000000;
                stroke-width: 1px;
            }
            to {
                fill: #ddd7c8;
                stroke: #7b0f16;
                stroke-width: 3px;
            }
        }

        @keyframes colorNegra {

            from {
                fill: #000000;
                stroke: #000000;
                stroke-width: 1px;
            }
            to {
                fill: #7b0f16;
                stroke: #7b0f16;
                stroke-width: 3px;
            }
        }

        @keyframes colorPuntoBlanco {

            from {
                fill: #000000;
            }
            to {
                fill: #7b0f16;
            }
        }

        @keyframes colorPuntoNegro {

            from {
                fill: #ffffff;
            }

            to {
                fill: #ddd7c8;
            }
        }

        svg {
            overflow: visible;
        }
    </style>

</head>

<body>

    <div id="container">

        <!-- ZONA SUPERIOR -->

        <section class="superior">

            <div id="taijitu">

                <!-- BLANCA -->

                <svg class="mitad blanca" viewBox="0 0 200 200">

                    <path class="forma-blanca" d="
                        M100 0
                        A100 100 0 0 1 100 200
                        A50 50 0 0 0 100 100
                        A50 50 0 0 1 100 0
                        Z" fill="#ffffff" stroke="#000000" stroke-width="1" />

                    <circle class="punto-blanco" cx="100" cy="50" r="12" fill="#000000" />

                </svg>

                <!-- NEGRA -->

                <svg class="mitad negra" viewBox="0 0 200 200">

                    <g transform="rotate(180 100 100)">

                        <path class="forma-negra" d="
                            M100 0
                            A100 100 0 0 1 100 200
                            A50 50 0 0 0 100 100
                            A50 50 0 0 1 100 0
                            Z" fill="#000000" stroke="#000000" stroke-width="1" />

                        <circle class="punto-negro" cx="100" cy="50" r="12" fill="#ffffff" />

                    </g>

                </svg>

            </div>

            <h1 id="titulo">
                HacemeGancho
            </h1>

        </section>

        <!-- ZONA CENTRAL -->

        <section class="medio">

            <div id="subtitulo">

                <div class="linea linea1">
                    "Una nueva forma...
                </div>

                <div class="linea linea2">
                    de Conectarse
                </div>

                <div class="linea linea3">
                    ... y Conocerse"
                </div>

            </div>

        </section>

        <!-- ZONA INFERIOR -->

        <section class="inferior">

            <button id="inicio" onclick="window.location.href='normas.html'">
                EMPECEMOS
            </button>

        </section>

    </div>

</body>

</html>
