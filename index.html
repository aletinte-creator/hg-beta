<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HacemeGancho</title>

    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #ddd7c8;
            font-family: Georgia, serif;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ==================================================
   DISTRIBUCIÓN 4 - 2 - 3
================================================== */

        .superior {
            flex: 4;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .medio {
            flex: 2;

            display: flex;
            justify-content: center;
            align-items: center;

            padding-bottom: 20px;

            text-align: center;
            padding-left: 24px;
            padding-right: 24px;
        }

        .inferior {
            flex: 3;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==================================================
   TAIJITU
================================================== */

        #taijitu {
            position: relative;

            width: 110px;
            height: 110px;

            animation: rotar 3s linear forwards;
            animation-delay: 3s;
        }

        .mitad {
            position: absolute;

            width: 100%;
            height: 100%;

            opacity: 0;
        }

        .blanca {
            animation:
                aparecer 1s forwards,
                moverBlanca 3s forwards;

            animation-delay: 1s, 1s;
        }

        .negra {
            animation:
                aparecer 1s forwards,
                moverNegra 3s forwards;

            animation-delay: 1s, 1s;
        }

        /* ==================================================
   TÍTULO
================================================== */

        #titulo {

            margin-top: 4px;

            font-size: clamp(30px, 7vw, 56px);

            font-weight: normal;

            letter-spacing: 2px;

            color: #5a1020;

            opacity: 0;

            animation: fadeIn 1s forwards;
            animation-delay: 3s;
        }

        /* ==================================================
   SUBTÍTULO
================================================== */

       #subtitulo {

            font-size: clamp(18px, 4vw, 30px);

            font-weight: bold;

            color: #5a1020;

            max-width: 80%;

            opacity: 0;

            animation: fadeIn 1s forwards;
            animation-delay: 6s;
        }

        /* ==================================================
   BOTÓN
================================================== */

        #inicio {

            min-width: 180px;

            padding: 12px 30px;

            border: 1px solid #7a1f2b;
            border-radius: 25px;

            background: transparent;

            color: #7a1f2b;

            font-family: inherit;

            font-size: clamp(16px, 3vw, 22px);

            letter-spacing: 2px;

            cursor: pointer;

            opacity: 0;

            animation: fadeIn 1s forwards;
            animation-delay: 8.5s;

            transition: all .25s ease;
        }

        #inicio:hover {
            background: #7a1f2b;
            color: #ffffff;
        }

        #inicio:active {
            transform: scale(0.97);
        }

        /* ==================================================
   ANIMACIONES
================================================== */

        @keyframes aparecer {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes moverBlanca {

            from {
                transform: translateX(-300px);
            }

            to {
                transform: translateX(0);
            }
        }

        @keyframes moverNegra {

            from {
                transform: translateX(300px);
            }

            to {
                transform: translateX(0);
            }
        }

        @keyframes rotar {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-290deg);
            }
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        svg {
            overflow: visible;
        }
    </style>

</head>

<body>

    <div id="container">

        <!-- ZONA SUPERIOR -->

        <section class="superior">

            <div id="taijitu">

                <!-- BLANCA -->

                <svg class="mitad blanca" viewBox="0 0 200 200">

                    <path d="
                M100 0
                A100 100 0 0 1 100 200
                A50 50 0 0 0 100 100
                A50 50 0 0 1 100 0
                Z" fill="white" stroke="black" stroke-width="1" />

                    <circle cx="100" cy="50" r="12" fill="black" />

                </svg>

                <!-- NEGRA -->

                <svg class="mitad negra" viewBox="0 0 200 200">

                    <g transform="rotate(180 100 100)">

                        <path d="
                    M100 0
                    A100 100 0 0 1 100 200
                    A50 50 0 0 0 100 100
                    A50 50 0 0 1 100 0
                    Z" fill="#000000"stroke="#000000"stroke-width="1"/>

                        <circle cx="100" cy="50" r="12" fill="#ffffff"/>

                    </g>

                </svg>

            </div>

            <h1 id="titulo">
                HacemeGancho
            </h1>

        </section>

        <!-- ZONA CENTRAL -->

        <section class="medio">

            <div id="subtitulo">
                "La nueva forma de conectarse"
            </div>

        </section>

        <!-- ZONA INFERIOR -->

        <section class="inferior">

            <button id="inicio" onclick="window.location.href='normas.html'">

                EMPECEMOS

            </button>

        </section>

    </div>

</body>

</html>
