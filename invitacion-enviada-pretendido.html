<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Enviada</title>

    <style>
        body {
            background: #ddd7c8;
            font-family: Georgia, serif;
            color: #7a1f2b;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-weight: normal;
            margin-bottom: 30px;
        }

        .foto-perfil {
            width: 140px;
            height: 140px;

            margin: 0 auto 20px auto;

            border-radius: 50%;
            overflow: hidden;

            border: 2px solid #7a1f2b;
        }

        .foto-perfil img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nombre {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .texto {
            line-height: 1.8;
            font-size: 18px;
            margin-bottom: 35px;
        }

        button {
            width: 100%;
            padding: 14px;

            border: 1px solid #7a1f2b;
            border-radius: 25px;

            background: transparent;
            color: #7a1f2b;

            cursor: pointer;
        }

        button:hover {
            background: #7a1f2b;
            color: white;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>INVITACIÓN ENVIADA</h1>

        <div class="foto-perfil" id="fotoPerfil"></div>

        <div class="nombre" id="nombreFacilitador">
            Pendiente
        </div>

        <div class="texto">

            Ha enviado la invitación correctamente.

            <br><br>

            Aguardamos la respuesta.

        </div>

        <button onclick="continuar()">
            CONTINUAR
        </button>

    </div>

    <script>

        document.getElementById('nombreFacilitador').textContent =
            localStorage.getItem('hg_nombre_facilitador') || '';

        const foto =
            localStorage.getItem('hg_foto_facilitador');

        if (foto) {

            document.getElementById('fotoPerfil').innerHTML =
                '<img src="' + foto + '">';

        }

        function continuar() {

            window.location.href =
                'aceptacion-pretendido.html';

        }

    </script>

</body>

</html>
